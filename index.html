<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>リール動作テスト</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;justify-content:center}.app{width:min(100%,520px);padding:18px}.title{text-align:center;font-size:22px;font-weight:800;margin:8px}.status{background:#222;border:1px solid #444;border-radius:12px;padding:12px;margin:12px 0;text-align:center;min-height:48px}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#050505;padding:10px;border-radius:14px}.reel{height:210px;background:#fafafa;color:#111;border:4px solid #555;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:34px;font-weight:800}.cell{height:64px;width:100%;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #ddd}.cell.mid{background:#fff4c2}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stop,.lever{border:0;border-radius:14px;font-weight:900;color:white;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.stop{height:58px;background:#d33;font-size:18px}.stop:disabled{background:#555;color:#aaa}.lever{width:100%;height:68px;margin-top:12px;background:#1677ff;font-size:22px}.lever:disabled{background:#555}.info{font-size:13px;line-height:1.6;color:#ccc;margin-top:14px;background:#1b1b1b;padding:12px;border-radius:10px}</style></head><body><main class='app'><div class='title'>🎰 リール動作テスト</div><div id='status' class='status'>LEVER ONを押してください</div><section class='reels'><div id='r0' class='reel'></div><div id='r1' class='reel'></div><div id='r2' class='reel'></div></section><div class='controls'><button id='s0' class='stop' disabled>左 STOP</button><button id='s1' class='stop' disabled>中 STOP</button><button id='s2' class='stop' disabled>右 STOP</button></div><button id='lever' class='lever'>LEVER ON</button><div class='info'>テスト仕様：CZ役 1/50、弱レア 1/60、強レア 1/120、リプレイ 1/7.3。残りはベル。左第1停止時、CZ役なら専用「C」が中段に止まりCZ1確。リプレイ・弱/強レアでは一部で「リプレイ以上目」を表示します。</div></main><script>
(function(){'use strict';
const SYMBOLS=['7','BAR','🔔','RE','🍒','C','◆','★'];
const reels=[
 ['7','🔔','RE','BAR','C','🔔','🍒','RE','7','◆','🔔','RE','BAR','★','🔔','C','RE','🍒','🔔','7','RE'],
 ['RE','7','🔔','BAR','🍒','RE','C','🔔','◆','RE','7','🔔','★','BAR','RE','🍒','🔔','C','RE','7','🔔'],
 ['🔔','RE','BAR','7','C','🍒','🔔','RE','◆','7','🔔','★','RE','BAR','🍒','🔔','RE','C','7','🔔','RE']
];
let spinning=false, stopped=[true,true,true], timers=[null,null,null], current=[0,0,0], role='bell', firstStop=-1;
const $=id=>document.getElementById(id); const status=$('status'), lever=$('lever'); const stops=[$('s0'),$('s1'),$('s2')];
function draw(i,center){const a=reels[i],n=a.length; $('r'+i).innerHTML=`<div class='cell'>${a[(center-1+n)%n]}</div><div class='cell mid'>${a[center%n]}</div><div class='cell'>${a[(center+1)%n]}</div>`;}
for(let i=0;i<3;i++) draw(i,current[i]);
function chooseRole(){const x=Math.random(); if(x<1/120)return 'strong'; if(x<1/120+1/60)return 'weak'; if(x<1/120+1/60+1/50)return 'cz'; if(x<1/120+1/60+1/50+1/7.3)return 'replay'; return 'bell';}
function start(){if(spinning)return; spinning=true; stopped=[false,false,false]; firstStop=-1; role=chooseRole(); lever.disabled=true; status.textContent='回転中… STOPを押してください'; stops.forEach(b=>b.disabled=false); for(let i=0;i<3;i++){timers[i]=setInterval(()=>{current[i]=(current[i]+1)%reels[i].length;draw(i,current[i]);},55+i*8);}}
function findIndex(i,sym){const arr=reels[i], candidates=[]; arr.forEach((v,k)=>{if(v===sym)candidates.push(k)}); return candidates[Math.floor(Math.random()*candidates.length)] ?? current[i];}
function targetFor(i){ if(i===0 && firstStop===0){ if(role==='cz') return findIndex(0,'C'); if(['replay','weak','strong'].includes(role) && Math.random()<0.55) return findIndex(0,'7'); }
 const map={bell:'🔔',replay:'RE',cz:'C',weak:'🍒',strong:'◆'}; return findIndex(i,map[role]||'🔔'); }
function stop(i){if(!spinning||stopped[i])return; if(firstStop<0)firstStop=i; clearInterval(timers[i]); stopped[i]=true; current[i]=targetFor(i); draw(i,current[i]); stops[i].disabled=true;
 if(i===0 && firstStop===0){ if(role==='cz')status.textContent='⚡ CZ 1確目！'; else if(['replay','weak','strong'].includes(role) && reels[0][current[0]]==='7')status.textContent='✨ リプレイ以上目！'; }
 if(stopped.every(Boolean)){spinning=false; lever.disabled=false; stops.forEach(b=>b.disabled=true); const names={bell:'押し順ベル',replay:'リプレイ',cz:'CZ役',weak:'弱レア役',strong:'強レア役'}; status.textContent=(status.textContent.includes('1確')||status.textContent.includes('以上目')?status.textContent+' → ':'')+names[role]+' 成立';}}
lever.addEventListener('click',start,{passive:true}); stops.forEach((b,i)=>b.addEventListener('click',()=>stop(i),{passive:true}));
})();
</script></body></html>
